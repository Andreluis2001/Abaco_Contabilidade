        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Equipamento'
          description: ''
    patch:
      operationId: api_equipamentos_partial_update
      parameters:
      - in: path
        name: numero_de_patrimonio
        schema:
          type: string
        description: A unique value identifying this equipamento.
        required: true
      tags:
