      - {}
      responses:
        '204':
          description: No response body
  /api/usuarios/create:
    post:
      operationId: api_usuarios_create_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Usuario'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Usuario'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Usuario'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
components:
  schemas:
    Computador:
      type: object
      properties:
        numero_de_patrimonio:
          type: string
        modelo:
          type: string
          maxLength: 100
        data_de_aquisicao:
          type: string
          format: date
        localizacao:
          type: string
          maxLength: 100
        data_da_garantia:
          type: string
          format: date
          nullable: true
        modelo_processador:
          type: string
          nullable: true
          maxLength: 100
        memoria_ram:
          type: string
          nullable: true
          maxLength: 100
        modelo_hd:
          type: string
          nullable: true
          maxLength: 100
        modelo_ssd:
          type: string
          nullable: true
          maxLength: 100
        modelo_fonte:
          type: string
          nullable: true
          maxLength: 100
        modelo_placa_mae:
          type: string
          nullable: true
          maxLength: 100
        modelo_placa_video:
          type: string
          nullable: true
          maxLength: 100
        descricao:
          type: string
          nullable: true
      required:
      - data_de_aquisicao
      - localizacao
      - modelo
      - numero_de_patrimonio
    Equipamento:
      type: object
      properties:
        numero_de_patrimonio:
          type: string
        equipamento:
          type: string
          maxLength: 100
        modelo:
          type: string
          nullable: true
          maxLength: 100
        data_de_aquisicao:
          type: string
          format: date
        data_da_garantia:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
      required:
      - data_de_aquisicao
      - equipamento
      - localizacao
      - numero_de_patrimonio
    PatchedComputador:
      type: object
      properties:
        numero_de_patrimonio:
          type: string
        modelo:
          type: string
          maxLength: 100
        data_de_aquisicao:
          type: string
          format: date
        localizacao:
          type: string
          maxLength: 100
        data_da_garantia:
          type: string
          format: date
          nullable: true
        modelo_processador:
          type: string
          nullable: true
          maxLength: 100
        memoria_ram:
          type: string
          nullable: true
          maxLength: 100
        modelo_hd:
          type: string
          nullable: true
          maxLength: 100
        modelo_ssd:
          type: string
          nullable: true
          maxLength: 100
        modelo_fonte:
          type: string
          nullable: true
          maxLength: 100
        modelo_placa_mae:
          type: string
          nullable: true
          maxLength: 100
        modelo_placa_video:
          type: string
          nullable: true
          maxLength: 100
        descricao:
          type: string
          nullable: true
    PatchedEquipamento:
      type: object
      properties:
        numero_de_patrimonio:
          type: string
        equipamento:
          type: string
          maxLength: 100
        modelo:
          type: string
          nullable: true
          maxLength: 100
        data_de_aquisicao:
          type: string
          format: date
        data_da_garantia:
          type: string
          format: date
          nullable: true
        localizacao:
          type: string
          maxLength: 100
        descricao:
          type: string
          nullable: true
    PatchedUsuario:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoleEnum'
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        numero_de_telefone:
          type: string
          nullable: true
          maxLength: 50
    RoleEnum:
      enum:
      - admin
      - tecnico
      type: string
      description: |-
        * `admin` - Admin
        * `tecnico` - Tecnico
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    Usuario:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          maxLength: 128
        role:
          $ref: '#/components/schemas/RoleEnum'
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        numero_de_telefone:
          type: string
          nullable: true
          maxLength: 50
      required:
      - password
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
