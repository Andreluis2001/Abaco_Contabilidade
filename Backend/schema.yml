openapi: 3.0.3
info:
  title: Abaco API
  version: 1.0.0
  description: API documentation for Abaco project
paths:
  /api/computadores/:
    get:
      operationId: api_computadores_list
      parameters:
      - in: query
        name: data_de_aquisicao
        schema:
          type: string
          format: date
      - in: query
        name: data_de_aquisicao__year__gt
        schema:
          type: number
      - in: query
        name: data_de_aquisicao__year__lt
        schema:
          type: number
      - in: query
        name: localizacao__icontains
        schema:
          type: string
      - in: query
        name: memoria_ram__icontains
        schema:
          type: string
      - in: query
        name: modelo__icontains
        schema:
          type: string
      - in: query
        name: modelo_fonte__icontains
        schema:
          type: string
      - in: query
        name: modelo_hd__icontains
        schema:
          type: string
      - in: query
        name: modelo_placa_mae__icontains
        schema:
          type: string
      - in: query
        name: modelo_placa_video__icontains
        schema:
          type: string
      - in: query
        name: modelo_processador__icontains
        schema:
          type: string
      - in: query
        name: modelo_ssd__icontains
        schema:
          type: string
      - in: query
        name: numero_de_patrimonio__icontains
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Computador'
          description: ''
    post:
      operationId: api_computadores_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Computador'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Computador'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Computador'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computador'
          description: ''
  /api/computadores/{numero_de_patrimonio}/:
    get:
      operationId: api_computadores_retrieve
      parameters:
      - in: path
        name: numero_de_patrimonio
