        name: numero_de_patrimonio
        schema:
          type: string
        description: A unique value identifying this computador.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Computador'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Computador'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Computador'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computador'
          description: ''
    patch:
      operationId: api_computadores_partial_update
      parameters:
      - in: path
        name: numero_de_patrimonio
        schema:
          type: string
        description: A unique value identifying this computador.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComputador'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComputador'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComputador'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Computador'
          description: ''
    delete:
      operationId: api_computadores_destroy
      parameters:
      - in: path
        name: numero_de_patrimonio
        schema:
          type: string
        description: A unique value identifying this computador.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
