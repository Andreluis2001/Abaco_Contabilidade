<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Usuários</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <a href="listaequipamentos.html">
          <img src="logo-abaco.png" alt="Logo Ábaco" class="logo-navbar">
        </a>
        <nav>
          <a href="listaequipamentos.html"><i class="bi bi-list"></i>Lista de Equipamentos</a>
          <a class="active" href="usuarios.html"><i class="bi bi-people-fill"></i>Usuários</a>
          <a href="listamanutencao.html"><i class="bi bi-exclamation-triangle-fill"></i>Lista de Manutenção</a>
          <a href="registromanutencao.html"><i class="bi bi-hammer"></i>Registro de Manutenção</a>
          <a href="cadastroequipamento.html"><i class="bi bi-pencil-square"></i>Cadastro de Equipamentos</a>
        </nav>
      </div>
      <div class="user" id="user-btn"><i class="bi bi-person-circle"></i>Matheus</div>
    </header>

    <div class="container">
      <main>
        <section>
          <div class="header-table">
            <h1>Lista de Usuários</h1>
            <button onclick="window.location.href='usuarios.html'" class="btn-add"><i class="bi bi-person-plus-fill"></i> Novo Usuário</button>
          </div>

          <table class="tabela-equipamentos">
            <thead>
              <tr>
                <th><input type="checkbox"></th>
                <th>Nome</th>
                <th>Email</th>
                <th>Organização</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <footer>
      <p>2025 Ábaco Contadores Associados. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script>
    function carregarUsuarios() {
      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      usuarios.forEach(usuario => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox"></td>
          <td>${usuario.nome}</td>
          <td>${usuario.email}</td>
          <td>${usuario.org}</td>
          <td><button onclick="excluirUsuario(${usuario.id})" class="btn-delete"><i class="bi bi-trash-fill"></i></button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function excluirUsuario(id) {
      let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      usuarios = usuarios.filter(user => user.id !== id);
      localStorage.setItem('usuarios', JSON.stringify(usuarios));
      carregarUsuarios();
    }

    window.onload = carregarUsuarios;
  </script>
</body>
</html>
