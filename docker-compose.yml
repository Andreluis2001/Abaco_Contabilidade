services:
  frontend:
    image: abaco_frontend:latest
    build: ./frontend
    ports:
      - "5174:5173"
    container_name: abaco_frontend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
          target: /app/frontend
          ignore:
            - node_modules

  abaco_database:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_PASSWORD: abaco
      POSTGRES_DB: abaco_database
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    container_name: abaco_database
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: abaco_backend:latest
    build: ./backend
    environment:
      - DB_NAME=abaco_database
      - DB_USER=postgres
      - DB_PASSWORD=abaco
      - DB_HOST=abaco_database
      - DB_PORT=5432
    ports:
      - "8001:8000"
    container_name: abaco_backend
    depends_on:
      - abaco_database
    develop:
      watch:
        - action: rebuild
          path: ./backend
          target: /app/backend
          ignore:
            - requirements.txt

volumes:
  postgres_data:
