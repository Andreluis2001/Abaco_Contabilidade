<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Equipamentos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <a href="listaequipamentos.html">
          <img src="logo-abaco.png" alt="Logo Ábaco" class="logo-navbar">
        </a>
        <nav>
          <a href="listaequipamentos.html"><i class="bi bi-list"></i>Lista de Equipamentos</a>
          <a href="usuarios.html"><i class="bi bi-people-fill"></i>Usuários</a>
          <a href="listamanutencao.html"><i class="bi bi-exclamation-triangle-fill"></i>Lista de Manutenção</a>
          <a href="registromanutencao.html"><i class="bi bi-hammer"></i>Registro de Manutenção</a>
          <a href="cadastroequipamento.html"><i class="bi bi-pencil-square"></i>Cadastro de Equipamentos</a>
        </nav>
      </div>
      <div class="user" id="user-btn"><i class="bi bi-person-circle"></i>Matheus</div>
    </header>

    <div class="container">
      <main>
        <section id="usuario-section">
          <h1>Cadastro de Usuários</h1>
          <form class="form" id="user-form">
            <div class="form-row">
              <div class="full-width">
                <label>Nome Completo*</label>
                <input type="text" id="full-name" placeholder="Digite seu nome completo" required>
              </div>
            </div>
            <div class="form-row">
              <div class="full-width">
                <label>Email*</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
              </div>
            </div>
            <div class="form-row">
              <div class="full-width">
                <label>Cargo*</label>
                <input type="text" id="organization" placeholder="Digite o nome da sua organização" required>
              </div>
            </div>
            <div class="form-row">
              <div><label>Senha*</label><input type="password" id="password" placeholder="Digite sua senha" required></div>
              <div><label>Confirmar Senha*</label><input type="password" id="confirm-password" placeholder="Confirme sua senha" required></div>
            </div>
            <button type="submit">CADASTRAR USUÁRIO</button>
            <button type="button" onclick="window.location.href='listaUsuarios.html'">← Voltar para Lista</button>
          </form>
        </section>
      </main>
    </div>

    <footer>
      <p>2025 Ábaco Contadores Associados. Todos os direitos reservados.</p>
    </footer>
  </div>

  <div class="side-panel" id="side-panel">
    <div class="side-panel-content">
      <h2>Usuário: Matheus</h2>
      <button id="disconnect-btn">
        <i class="bi bi-person-circle"></i>
        <a href="index.html">Desconectar</a>
        <i class="bi bi-box-arrow-in-right"></i>
      </button>
    </div>
  </div>

  <script>
    document.getElementById('user-btn').addEventListener('click', () => {
      document.getElementById('side-panel').classList.toggle('active');
    });
    document.getElementById('disconnect-btn').addEventListener('click', () => {
      alert('Desconectado!');
      document.getElementById('side-panel').classList.remove('active');
    });

    document.getElementById('user-form').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('full-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const org = document.getElementById('organization').value.trim();
      const pwd = document.getElementById('password').value;
      const pwdConfirm = document.getElementById('confirm-password').value;

      if (!name || !email || !org) {
        alert('Preencha todos os campos obrigatórios.');
        return;
      }
      if (pwd !== pwdConfirm) {
        alert('As senhas não coincidem.');
        return;
      }

      const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
      const novoUsuario = { id: Date.now(), nome: name, email, org };
      usuarios.push(novoUsuario);
      localStorage.setItem('usuarios', JSON.stringify(usuarios));

      alert('Usuário cadastrado com sucesso!');
      window.location.href = 'usuarios.html';
    });
  </script>
</body>
</html>
